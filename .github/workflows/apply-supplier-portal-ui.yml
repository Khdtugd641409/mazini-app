name: Apply supplier portal UI

on:
  push:
    branches:
      - shared-construction-stages-20260808
    paths:
      - .github/workflows/apply-supplier-portal-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shared-construction-stages-20260808
          fetch-depth: 0

      - name: Apply supplier UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          home_path = Path('src/pages/HomePage.jsx')
          home = home_path.read_text()

          home = home.replace(
              '  const [isSupervisorMenuOpen, setIsSupervisorMenuOpen] = useState(false);',
              '  const [isSupervisorMenuOpen, setIsSupervisorMenuOpen] = useState(false);\n  const [isSupplierMenuOpen, setIsSupplierMenuOpen] = useState(false);'
          )
          home = home.replace(
              '      if (!nextValue) setIsSupervisorMenuOpen(false);',
              '      if (!nextValue) {\n        setIsSupervisorMenuOpen(false);\n        setIsSupplierMenuOpen(false);\n      }'
          )
          home = home.replace(
              '    setIsSupervisorMenuOpen(false);\n  };',
              '    setIsSupervisorMenuOpen(false);\n    setIsSupplierMenuOpen(false);\n  };',
              1
          )

          marker = '''  const handleOpenAdmin = () => {'''
          supplier_handlers = '''  const handleOpenSupplier = () => {\n    closeLoginMenu();\n    window.location.href = "/supplier";\n  };\n\n  const handleOpenSupplierApplication = () => {\n    closeLoginMenu();\n    window.location.href = "/supplier/application";\n  };\n\n'''
          if supplier_handlers.strip() not in home:
              home = home.replace(marker, supplier_handlers + marker)

          admin_button = '''              <button\n                type="button"\n                role="menuitem"\n                onClick={handleOpenAdmin}\n                disabled={isCheckingAdmin}\n              >\n                <span>إدارة منصة</span>\n                <span aria-hidden="true">🛡️</span>\n              </button>'''
          supplier_menu = '''              <button\n                type="button"\n                role="menuitem"\n                onClick={() => {\n                  setIsSupplierMenuOpen((current) => !current);\n                  setIsSupervisorMenuOpen(false);\n                }}\n                aria-expanded={isSupplierMenuOpen}\n              >\n                <span>مورد</span>\n                <span aria-hidden="true">🚚</span>\n              </button>\n\n              {isSupplierMenuOpen && (\n                <div\n                  style={{\n                    display: "grid",\n                    gap: 8,\n                    padding: "10px 12px 12px",\n                    background: "rgba(23,63,54,0.04)",\n                    borderRadius: 12,\n                    margin: "0 8px 6px",\n                  }}\n                >\n                  <button type="button" role="menuitem" onClick={handleOpenSupplier} style={{ minHeight: 44 }}>\n                    <span>تسجيل الدخول</span>\n                    <span aria-hidden="true">🔐</span>\n                  </button>\n                  <button type="button" role="menuitem" onClick={handleOpenSupplierApplication} style={{ minHeight: 44 }}>\n                    <span>إنشاء حساب</span>\n                    <span aria-hidden="true">📝</span>\n                  </button>\n                </div>\n              )}\n\n'''
          if '<span>مورد</span>' not in home:
              if admin_button not in home:
                  raise SystemExit('HomePage admin marker not found')
              home = home.replace(admin_button, supplier_menu + admin_button)

          home_path.write_text(home)

          admin_supplier = r'''import { useEffect, useState } from "react";
          import { supabase } from "../../lib/supabase.js";

          const LABELS = { under_review: "تحت المراجعة", needs_completion: "مطلوب استكمال", approved: "مقبول", rejected: "مرفوض" };

          export default function AdminSupplierApplicationsPage() {
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(true);
            const [busyId, setBusyId] = useState("");
            const [notes, setNotes] = useState({});
            const [errorMessage, setErrorMessage] = useState("");

            async function reload() {
              setLoading(true);
              setErrorMessage("");
              try {
                const { data, error } = await supabase.rpc("admin_list_supplier_applications");
                if (error) throw error;
                setItems(Array.isArray(data) ? data : []);
              } catch (error) {
                setErrorMessage(error?.message || "تعذر تحميل طلبات الموردين.");
              } finally {
                setLoading(false);
              }
            }

            useEffect(() => { reload(); }, []);

            async function decide(id, decision) {
              if (busyId) return;
              try {
                setBusyId(id);
                setErrorMessage("");
                const { error } = await supabase.rpc("admin_decide_supplier_application", {
                  p_application_id: id,
                  p_decision: decision,
                  p_note: String(notes[id] || "").trim() || null,
                });
                if (error) throw error;
                await reload();
              } catch (error) {
                setErrorMessage(error?.message || "تعذر تنفيذ قرار الإدارة.");
              } finally {
                setBusyId("");
              }
            }

            return (
              <main style={{ minHeight: "100vh", background: "#f5f3ee", color: "#173f36", direction: "rtl", padding: "24px 16px 60px" }}>
                <div style={{ maxWidth: 1050, margin: "0 auto", display: "grid", gap: 16 }}>
                  <header style={{ background: "#fff", border: "1px solid #e3e0d7", borderRadius: 18, padding: 20, display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
                    <div><p style={{ margin: 0 }}>إدارة منصة نايف المزيني</p><h1 style={{ marginBottom: 0 }}>طلبات تسجيل الموردين</h1></div>
                    <button type="button" onClick={() => { window.location.href = "/admin/dashboard"; }}>لوحة الإدارة</button>
                  </header>
                  {errorMessage && <p style={{ color: "#991b1b" }}>{errorMessage}</p>}
                  {loading ? <section style={{ background: "#fff", padding: 20, borderRadius: 18 }}>جاري التحميل...</section> : items.length === 0 ? <section style={{ background: "#fff", padding: 20, borderRadius: 18 }}>لا توجد طلبات موردين حاليًا.</section> : items.map((item) => (
                    <article key={item.id} style={{ background: "#fff", border: "1px solid #e3e0d7", borderRadius: 18, padding: 20, display: "grid", gap: 12 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}><div><h2 style={{ margin: 0 }}>{item.organizationName}</h2><strong>{LABELS[item.status] || item.status}</strong></div><a href={item.mapsUrl} target="_blank" rel="noreferrer">فتح الموقع</a></div>
                      <div>السجل التجاري: {item.commercialRegistrationNumber}</div>
                      <div>البريد: {item.email}</div>
                      <div>الجوال: {item.mobileNumber}</div>
                      <div>المنتج: {item.initialProductName}</div>
                      <textarea rows="3" placeholder="ملاحظة الإدارة" value={notes[item.id] || ""} onChange={(event) => setNotes((current) => ({ ...current, [item.id]: event.target.value }))} />
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <button type="button" disabled={busyId === item.id} onClick={() => decide(item.id, "approved")}>قبول</button>
                        <button type="button" disabled={busyId === item.id} onClick={() => decide(item.id, "needs_completion")}>طلب استكمال</button>
                        <button type="button" disabled={busyId === item.id} onClick={() => decide(item.id, "rejected")}>رفض</button>
                      </div>
                    </article>
                  ))}
                </div>
              </main>
            );
          }
          '''
          # Remove indentation added by YAML heredoc nesting.
          import textwrap
          Path('src/pages/admin/AdminSupplierApplicationsPage.jsx').write_text(textwrap.dedent(admin_supplier))

          main_path = Path('src/main.jsx')
          main = main_path.read_text()
          main = main.replace(
              'import AdminSupervisorApplicationsPage from "./pages/admin/AdminSupervisorApplicationsPage.jsx";',
              'import AdminSupervisorApplicationsPage from "./pages/admin/AdminSupervisorApplicationsPage.jsx";\nimport SupplierApplicationPage from "./pages/SupplierApplicationPage.jsx";\nimport SupplierPortalPage from "./pages/SupplierPortalPage.jsx";\nimport AdminSupplierApplicationsPage from "./pages/admin/AdminSupplierApplicationsPage.jsx";'
          )
          main = main.replace(
              'const SUPERVISOR_SESSION_KEY = "nm_supervisor_session_started_at";',
              'const SUPERVISOR_SESSION_KEY = "nm_supervisor_session_started_at";\nconst SUPPLIER_SESSION_KEY = "nm_supplier_session_started_at";'
          )

          guard_marker = '''function FloatingShortcut({ href, children, bottom = 18 }) {'''
          supplier_guard = '''function SupplierSessionGuard({ children }) {\n  const [ready, setReady] = useState(false);\n\n  useEffect(() => {\n    let active = true;\n    async function enforce(session) {\n      if (!session) {\n        localStorage.removeItem(SUPPLIER_SESSION_KEY);\n        if (active) setReady(true);\n        return;\n      }\n      const stored = Number(localStorage.getItem(SUPPLIER_SESSION_KEY) || 0);\n      const startedAt = stored || Date.now();\n      if (!stored) localStorage.setItem(SUPPLIER_SESSION_KEY, String(startedAt));\n      if (Date.now() - startedAt >= THIRTY_DAYS_MS) {\n        await supabase.auth.signOut();\n        localStorage.removeItem(SUPPLIER_SESSION_KEY);\n      }\n      if (active) setReady(true);\n    }\n    supabase.auth.getSession().then(({ data }) => enforce(data?.session || null));\n    const { data: listener } = supabase.auth.onAuthStateChange((event, session) => {\n      if (event === "SIGNED_IN" && !localStorage.getItem(SUPPLIER_SESSION_KEY)) localStorage.setItem(SUPPLIER_SESSION_KEY, String(Date.now()));\n      if (event === "SIGNED_OUT") localStorage.removeItem(SUPPLIER_SESSION_KEY);\n      enforce(session || null);\n    });\n    return () => { active = false; listener?.subscription?.unsubscribe(); };\n  }, []);\n\n  if (!ready) return <main style={{ padding: 24, direction: "rtl" }}>جاري التحقق من جلسة المورد...</main>;\n  return children;\n}\n\n'''
          if 'function SupplierSessionGuard' not in main:
              main = main.replace(guard_marker, supplier_guard + guard_marker)

          route_marker = '''if (normalizedPath === "/supervisor/application") {'''
          supplier_routes = '''if (normalizedPath === "/supplier/application") {\n  rootContent = <SupplierApplicationPage />;\n} else if (normalizedPath === "/supplier") {\n  rootContent = (\n    <SupplierSessionGuard>\n      <SupplierPortalPage />\n    </SupplierSessionGuard>\n  );\n} else if (normalizedPath === "/admin/supplier-applications") {\n  rootContent = <AdminSupplierApplicationsPage />;\n} else '''
          if 'normalizedPath === "/supplier/application"' not in main:
              main = main.replace(route_marker, supplier_routes + route_marker)

          old_admin = '''  rootContent = (\n    <>\n      <App />\n      <FloatingShortcut href="/admin/supervisor-applications">\n        طلبات تسجيل المشرفين\n      </FloatingShortcut>\n    </>\n  );'''
          new_admin = '''  rootContent = (\n    <>\n      <App />\n      <FloatingShortcut href="/admin/supervisor-applications" bottom={18}>طلبات تسجيل المشرفين</FloatingShortcut>\n      <FloatingShortcut href="/admin/supplier-applications" bottom={70}>طلبات تسجيل الموردين</FloatingShortcut>\n    </>\n  );'''
          main = main.replace(old_admin, new_admin)
          main_path.write_text(main)
          PY

      - name: Commit supplier UI
        shell: bash
        run: |
          git config user.name "ChatGPT Supplier Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/HomePage.jsx src/main.jsx src/pages/admin/AdminSupplierApplicationsPage.jsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Connect supplier registration portal and admin review"
          git push origin HEAD:shared-construction-stages-20260808
