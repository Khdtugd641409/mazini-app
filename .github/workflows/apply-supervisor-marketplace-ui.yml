name: Apply supervisor marketplace UI

on:
  push:
    branches:
      - shared-construction-stages-20260808

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shared-construction-stages-20260808
          fetch-depth: 0
      - name: Patch existing files only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:90]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Service project: city is required for geographic matching.
          p='src/pages/CustomerServiceApplicationPage.jsx'
          patch(p, '  propertyLocationUrl: "",\n  landArea: "",', '  propertyLocationUrl: "",\n  city: "",\n  landArea: "",')
          patch(p, '      !formData.propertyLocationUrl.trim() ||\n      !formData.landArea ||', '      !formData.propertyLocationUrl.trim() ||\n      !formData.city.trim() ||\n      !formData.landArea ||')
          patch(p, '          propertyLocationUrl:\n            formData.propertyLocationUrl,\n\n          landArea:', '          propertyLocationUrl:\n            formData.propertyLocationUrl,\n\n          city:\n            formData.city,\n\n          landArea:')
          patch(p, '''                </label>\n\n                <label>\n                  <span>\n                    المساحة بالمتر المربع\n                  </span>''', '''                </label>\n\n                <label>\n                  <span>مدينة المشروع</span>\n                  <input\n                    type="text"\n                    placeholder="مثال: الرياض"\n                    value={formData.city}\n                    onChange={(event) => updateField("city", event.target.value)}\n                    disabled={isSubmitting}\n                    required\n                  />\n                </label>\n\n                <label>\n                  <span>\n                    المساحة بالمتر المربع\n                  </span>''')

          p='src/services/customerServiceProjectService.js'
          patch(p, '''function validateLandArea(value) {''', '''function validateCity(value) {\n  const city = normalizeText(value);\n  if (city.length < 2 || city.length > 100) {\n    throw new Error("أدخل مدينة المشروع بصورة صحيحة.");\n  }\n  return city;\n}\n\nfunction validateLandArea(value) {''')
          patch(p, '''    message.includes(\n      "INVALID_LAND_AREA"\n    )''', '''    message.includes(\n      "INVALID_PROJECT_CITY"\n    )\n  ) {\n    return "مدينة المشروع غير صحيحة.";\n  }\n\n  if (\n    message.includes(\n      "INVALID_LAND_AREA"\n    )''')
          patch(p, '''  propertyLocationUrl,\n  landArea,''', '''  propertyLocationUrl,\n  city,\n  landArea,''')
          patch(p, '''  const validatedLandArea =\n    validateLandArea(landArea);''', '''  const validatedCity =\n    validateCity(city);\n\n  const validatedLandArea =\n    validateLandArea(landArea);''')
          patch(p, '''        p_land_area:\n          validatedLandArea,''', '''        p_city:\n          validatedCity,\n\n        p_land_area:\n          validatedLandArea,''')

          # Supervisor portal: marketplace + offers + fee state.
          p='src/App.jsx'
          patch(p, '''  const [successMessage, setSuccessMessage] = useState("");\n\n  async function loadSupervisorDashboard() {''', '''  const [successMessage, setSuccessMessage] = useState("");\n  const [availableProjects, setAvailableProjects] = useState([]);\n  const [myOffers, setMyOffers] = useState([]);\n  const [offerPrices, setOfferPrices] = useState({});\n  const [offerNotes, setOfferNotes] = useState({});\n\n  async function loadSupervisorDashboard() {''')
          old='''  async function loadSupervisorDashboard() {\n    const { data, error } = await supabase.rpc("supervisor_get_dashboard");\n\n    if (error) {\n      const message = String(error.message || "");\n      if (message.includes("SUPERVISOR_AUTHORIZATION_REQUIRED")) {\n        setAuthStep("not-approved");\n        return false;\n      }\n      throw error;\n    }\n\n    setDashboard({\n      projects: Array.isArray(data?.projects) ? data.projects : [],\n      reminders: Array.isArray(data?.reminders) ? data.reminders : [],\n    });\n    setAuthStep("dashboard");\n    return true;\n  }'''
          new='''  async function loadSupervisorDashboard() {\n    const [dashboardResult, availableResult, offersResult] = await Promise.all([\n      supabase.rpc("supervisor_get_dashboard"),\n      supabase.rpc("supervisor_list_available_projects"),\n      supabase.rpc("supervisor_list_my_project_offers"),\n    ]);\n\n    if (dashboardResult.error) {\n      const message = String(dashboardResult.error.message || "");\n      if (message.includes("SUPERVISOR_AUTHORIZATION_REQUIRED")) {\n        setAuthStep("not-approved");\n        return false;\n      }\n      throw dashboardResult.error;\n    }\n    if (availableResult.error) throw availableResult.error;\n    if (offersResult.error) throw offersResult.error;\n\n    const data = dashboardResult.data;\n    setDashboard({\n      projects: Array.isArray(data?.projects) ? data.projects : [],\n      reminders: Array.isArray(data?.reminders) ? data.reminders : [],\n    });\n    setAvailableProjects(Array.isArray(availableResult.data) ? availableResult.data : []);\n    setMyOffers(Array.isArray(offersResult.data) ? offersResult.data : []);\n    setAuthStep("dashboard");\n    return true;\n  }'''
          patch(p, old, new)
          patch(p, '''  const shellStyle = {''', '''  async function submitProjectOffer(project) {\n    const key = `${project.projectType}:${project.projectId}`;\n    const price = Number(offerPrices[key]);\n    if (!Number.isFinite(price) || price <= 0 || loading) {\n      setErrorMessage("أدخل سعرًا صحيحًا للعرض.");\n      return;\n    }\n    try {\n      setLoading(true);\n      setErrorMessage("");\n      setSuccessMessage("");\n      const { error } = await supabase.rpc("supervisor_submit_project_offer", {\n        p_project_type: project.projectType,\n        p_project_id: project.projectId,\n        p_offer_price: price,\n        p_offer_note: String(offerNotes[key] || "").trim() || null,\n      });\n      if (error) throw error;\n      setSuccessMessage("تم إرسال العرض إلى العميل.");\n      setOfferPrices((current) => ({ ...current, [key]: "" }));\n      setOfferNotes((current) => ({ ...current, [key]: "" }));\n      await loadSupervisorDashboard();\n    } catch (error) {\n      setErrorMessage(error?.message || "تعذر إرسال العرض.");\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  const shellStyle = {''')
          patch(p, '''        {successMessage && <div style={cardStyle}>{successMessage}</div>}\n\n        <section style={cardStyle}>\n          <h2 style={{ marginTop: 0 }}>جدول الأعمال</h2>''', '''        {successMessage && <div style={cardStyle}>{successMessage}</div>}\n\n        <section style={cardStyle}>\n          <h2 style={{ marginTop: 0 }}>مشاريع متاحة في منطقتك</h2>\n          <p>تظهر هنا المشاريع التي تقع في مدينتك أو ضمن مناطق خدمتك ولم يُفعّل لها مشرف بعد.</p>\n          {availableProjects.length === 0 ? (\n            <p>لا توجد مشاريع متاحة حاليًا في منطقتك.</p>\n          ) : (\n            <div style={{ display: "grid", gap: 12 }}>\n              {availableProjects.map((project) => {\n                const key = `${project.projectType}:${project.projectId}`;\n                return (\n                  <article key={key} style={{ padding: 14, border: "1px solid #e5e7eb", borderRadius: 12 }}>\n                    <strong style={{ display: "block" }}>{project.projectNumber || "مشروع"}</strong>\n                    <div>{project.city || ""}{project.district ? ` — ${project.district}` : ""}</div>\n                    <div>{project.projectTitle || ""} — {project.landArea || "-"} م² — {project.floors || "-"} دور</div>\n                    <small>المرحلة: {project.currentStage || "غير محددة"}</small>\n                    {project.locationUrl && <p><a href={project.locationUrl} target="_blank" rel="noreferrer">فتح موقع المشروع</a></p>}\n                    {project.myOfferStatus ? (\n                      <p><strong>تم إرسال عرضك:</strong> {Number(project.myOfferPrice || 0).toLocaleString("ar-SA")} ريال</p>\n                    ) : (\n                      <div style={{ display: "grid", gap: 8, marginTop: 10 }}>\n                        <input type="number" min="1" step="0.01" placeholder="سعر الإشراف بالريال" value={offerPrices[key] || ""} onChange={(e) => setOfferPrices((current) => ({ ...current, [key]: e.target.value }))} disabled={loading} />\n                        <textarea rows="2" placeholder="ملاحظة العرض (اختياري)" value={offerNotes[key] || ""} onChange={(e) => setOfferNotes((current) => ({ ...current, [key]: e.target.value }))} disabled={loading} />\n                        <button type="button" onClick={() => submitProjectOffer(project)} disabled={loading || !offerPrices[key]}>إرسال عرض</button>\n                      </div>\n                    )}\n                  </article>\n                );\n              })}\n            </div>\n          )}\n        </section>\n\n        <section style={cardStyle}>\n          <h2 style={{ marginTop: 0 }}>عروضي</h2>\n          {myOffers.length === 0 ? <p>لم ترسل عروضًا بعد.</p> : (\n            <div style={{ display: "grid", gap: 9 }}>\n              {myOffers.map((offer) => (\n                <article key={offer.id} style={{ padding: 12, border: "1px solid #e5e7eb", borderRadius: 12 }}>\n                  <strong>{offer.projectNumber || "مشروع"}</strong>\n                  <div>قيمة العرض: {Number(offer.offerPrice || 0).toLocaleString("ar-SA")} ريال</div>\n                  <div>الحالة: {offer.status === "submitted" ? "بانتظار اختيار العميل" : offer.status === "customer_selected" ? "اختارك العميل — بانتظار اعتماد الإدارة" : offer.status === "fee_pending" ? "معتمد — بانتظار سداد رسوم المنصة" : offer.status === "active" ? "تم التفعيل" : offer.status === "admin_rejected" ? "لم تعتمد الإدارة العرض" : offer.status}</div>\n                  {offer.status === "fee_pending" && <p><strong>رسوم المنصة 2٪: {Number(offer.feeAmount || 0).toLocaleString("ar-SA")} ريال</strong><br />بعد السداد وتأكيد الإدارة تُفتح أدوات الإشراف على المشروع.</p>}\n                </article>\n              ))}\n            </div>\n          )}\n        </section>\n\n        <section style={cardStyle}>\n          <h2 style={{ marginTop: 0 }}>جدول الأعمال</h2>''')

          # Customer project: offers list + selection.
          p='src/pages/CustomerFilePage.jsx'
          patch(p, 'import { useState } from "react";', 'import { useEffect, useState } from "react";')
          patch(p, '''function ConstructionStageCard({ workspace }) {''', '''function SupervisorOffersCard({ projectId }) {\n  const [offers, setOffers] = useState([]);\n  const [loading, setLoading] = useState(true);\n  const [errorMessage, setErrorMessage] = useState("");\n\n  async function loadOffers() {\n    if (!projectId) return;\n    try {\n      setLoading(true);\n      setErrorMessage("");\n      const { data, error } = await supabase.rpc("customer_get_supervisor_offers", { p_project_id: projectId });\n      if (error) throw error;\n      setOffers(Array.isArray(data) ? data : []);\n    } catch (error) {\n      setErrorMessage(error?.message || "تعذر تحميل عروض المشرفين.");\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  useEffect(() => { loadOffers(); }, [projectId]);\n\n  async function selectOffer(offerId) {\n    if (!offerId || loading) return;\n    try {\n      setLoading(true);\n      setErrorMessage("");\n      const { error } = await supabase.rpc("customer_select_supervisor_offer", { p_offer_id: offerId });\n      if (error) throw error;\n      await loadOffers();\n    } catch (error) {\n      setErrorMessage(error?.message || "تعذر اختيار العرض.");\n      setLoading(false);\n    }\n  }\n\n  const selectedOffer = offers.find((offer) => ["customer_selected","fee_pending","active"].includes(offer.status));\n\n  return (\n    <section className="customer-file-card">\n      <h2>عروض المشرفين</h2>\n      {errorMessage && <p className="customer-file-notice" style={{ color: "#991b1b" }}>{errorMessage}</p>}\n      {selectedOffer?.status === "customer_selected" && <p className="customer-file-notice"><strong>تم اختيار المشرف. في انتظار قبول إدارة المنصة.</strong></p>}\n      {selectedOffer?.status === "fee_pending" && <p className="customer-file-notice"><strong>اعتمدت الإدارة اختيارك. بانتظار سداد المشرف رسوم المنصة لتفعيل الإشراف.</strong></p>}\n      {selectedOffer?.status === "active" && <p className="customer-file-notice"><strong>تم تفعيل المشرف على المشروع.</strong></p>}\n      {loading ? <p>جاري تحميل العروض...</p> : offers.filter((offer) => offer.status !== "expired").length === 0 ? <p>لم تصل عروض من المشرفين حتى الآن.</p> : (\n        <div style={{ display: "grid", gap: 10 }}>\n          {offers.filter((offer) => offer.status !== "expired").map((offer) => (\n            <article key={offer.id} style={{ padding: 14, border: offer.id === selectedOffer?.id ? "2px solid #0b3b32" : "1px solid #e1e5e1", borderRadius: 14 }}>\n              <strong style={{ display: "block", fontSize: 18 }}>{offer.supervisor?.name || "مشرف"}</strong>\n              {offer.supervisor?.organizationName && <span>{offer.supervisor.organizationName}</span>}\n              <div>{offer.supervisor?.professionalTitle || ""}</div>\n              <div>الخبرة: {Number(offer.supervisor?.experienceYears || 0)} سنة — المشاريع السابقة: {Number(offer.supervisor?.completedProjectsCount || 0)}</div>\n              <p><strong>{Number(offer.price || 0).toLocaleString("ar-SA")} ريال</strong></p>\n              {offer.note && <p>{offer.note}</p>}\n              {offer.status === "submitted" && !selectedOffer && (\n                <button type="button" className="customer-land-entry-button" onClick={() => selectOffer(offer.id)} disabled={loading}>اختيار العرض</button>\n              )}\n            </article>\n          ))}\n        </div>\n      )}\n      <p className="customer-file-notice" style={{ marginBottom: 0 }}>يمكنك المقارنة بالسعر والخبرة وسجل المشرف؛ لا يفرض النظام اختيار الأرخص تلقائيًا.</p>\n    </section>\n  );\n}\n\nfunction ConstructionStageCard({ workspace }) {''')
          patch(p, '''        <ConstructionStageCard\n          workspace={constructionWorkspace}\n        />\n\n        <section''', '''        <ConstructionStageCard\n          workspace={constructionWorkspace}\n        />\n\n        <SupervisorOffersCard projectId={customerFile.id} />\n\n        <section''')

          # Admin: selected offer review replaces direct assignment UI.
          p='src/pages/admin/AdminDashboardPage.jsx'
          patch(p, '''  const [supervisorsError, setSupervisorsError] = useState("");\n\n  const [adminStageWorkspace''', '''  const [supervisorsError, setSupervisorsError] = useState("");\n  const [supervisorOfferReviews, setSupervisorOfferReviews] = useState([]);\n\n  const [adminStageWorkspace''')
          patch(p, '''    const [candidatesResult, assignmentsResult] = await Promise.all([\n      supabase.rpc("admin_list_supervisor_candidates"),\n      supabase.rpc("admin_list_supervisor_assignment_options"),\n    ]);''', '''    const [candidatesResult, assignmentsResult, offersResult] = await Promise.all([\n      supabase.rpc("admin_list_supervisor_candidates"),\n      supabase.rpc("admin_list_supervisor_assignment_options"),\n      supabase.rpc("admin_list_selected_supervisor_offers"),\n    ]);''')
          patch(p, '''    if (assignmentsResult.error) throw assignmentsResult.error;\n\n    const candidates''', '''    if (assignmentsResult.error) throw assignmentsResult.error;\n    if (offersResult.error) throw offersResult.error;\n\n    const candidates''')
          patch(p, '''    setSupervisorCandidates(candidates);\n    setActiveSupervisors(supervisors);''', '''    setSupervisorCandidates(candidates);\n    setSupervisorOfferReviews(Array.isArray(offersResult.data) ? offersResult.data : []);\n    setActiveSupervisors(supervisors);''')
          patch(p, '''  async function handleViewProjectStage(projectId) {''', '''  async function handleDecideSupervisorOffer(offerId, approve) {\n    if (!offerId || supervisorsSaving) return;\n    const note = approve ? "" : (window.prompt("سبب عدم الاعتماد (اختياري):") || "");\n    try {\n      setSupervisorsSaving(true);\n      setSupervisorsError("");\n      const { error } = await supabase.rpc("admin_decide_supervisor_offer", {\n        p_offer_id: offerId, p_approve: Boolean(approve), p_note: note || null,\n      });\n      if (error) throw error;\n      setSupervisorsMessage(approve ? "تم اعتماد اختيار العميل، وأصبحت رسوم 2٪ مستحقة على المشرف." : "تم رفض اختيار المشرف ويمكن للعميل اختيار عرض آخر.");\n      await reloadSupervisors();\n    } catch (error) {\n      setSupervisorsError(error?.message || "تعذر تنفيذ قرار العرض.");\n    } finally { setSupervisorsSaving(false); }\n  }\n\n  async function handleConfirmSupervisorFee(offerId) {\n    if (!offerId || supervisorsSaving) return;\n    try {\n      setSupervisorsSaving(true);\n      setSupervisorsError("");\n      const { error } = await supabase.rpc("admin_confirm_supervisor_offer_fee_paid", { p_offer_id: offerId });\n      if (error) throw error;\n      setSupervisorsMessage("تم تأكيد سداد الرسوم وتفعيل المشرف على المشروع.");\n      await reloadSupervisors();\n    } catch (error) {\n      setSupervisorsError(error?.message || "تعذر تأكيد السداد.");\n    } finally { setSupervisorsSaving(false); }\n  }\n\n  async function handleViewProjectStage(projectId) {''')
          patch(p, '<p>اعتماد حسابات المشرفين وتعيينهم على المشاريع.</p>', '<p>اعتماد حسابات المشرفين ومراجعة اختيارات العملاء وتأكيد رسوم المنصة.</p>')
          start='''                  <form onSubmit={handleAssignSupervisor} style={{ display: "grid", gap: 10, borderTop: "1px solid #e5e7eb", paddingTop: 20 }}>'''
          end='''                  </form>\n\n                  <div style={{ borderTop: "1px solid #e5e7eb", paddingTop: 20 }}>\n                    <h3 style={{ marginTop: 0 }}>المشاريع والتعيينات الحالية</h3>'''
          replacement='''                  <div style={{ display: "grid", gap: 10, borderTop: "1px solid #e5e7eb", paddingTop: 20 }}>\n                    <h3 style={{ margin: 0 }}>اختيارات العملاء وعروض المشرفين</h3>\n                    {supervisorOfferReviews.filter((offer) => ["customer_selected","fee_pending"].includes(offer.status)).length === 0 ? (\n                      <p>لا توجد عروض بانتظار إجراء من الإدارة.</p>\n                    ) : supervisorOfferReviews.filter((offer) => ["customer_selected","fee_pending"].includes(offer.status)).map((offer) => (\n                      <article key={offer.id} style={{ padding: 12, border: "1px solid #e5e7eb", borderRadius: 10 }}>\n                        <strong>{offer.projectNumber || "مشروع"}</strong>\n                        <div>العميل: {offer.customerName || "غير متوفر"}</div>\n                        <div>المشرف: {offer.supervisorName}{offer.organizationName ? ` — ${offer.organizationName}` : ""}</div>\n                        <div>قيمة العرض: {Number(offer.offerPrice || 0).toLocaleString("ar-SA")} ريال</div>\n                        {offer.status === "customer_selected" ? (\n                          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>\n                            <button type="button" onClick={() => handleDecideSupervisorOffer(offer.id, true)} disabled={supervisorsSaving}>اعتماد</button>\n                            <button type="button" onClick={() => handleDecideSupervisorOffer(offer.id, false)} disabled={supervisorsSaving}>رفض</button>\n                          </div>\n                        ) : (\n                          <div style={{ marginTop: 8 }}>\n                            <strong>رسوم المنصة 2٪: {Number(offer.feeAmount || 0).toLocaleString("ar-SA")} ريال</strong>\n                            <div><button type="button" onClick={() => handleConfirmSupervisorFee(offer.id)} disabled={supervisorsSaving}>تأكيد استلام الرسوم وتفعيل المشرف</button></div>\n                          </div>\n                        )}\n                      </article>\n                    ))}\n                  </div>\n\n                  <div style={{ borderTop: "1px solid #e5e7eb", paddingTop: 20 }}>\n                    <h3 style={{ marginTop: 0 }}>المشاريع والتعيينات الحالية</h3>'''
          text=Path(p).read_text()
          i=text.find(start)
          j=text.find(end)
          if i<0 or j<0 or j<i: raise SystemExit('ADMIN ASSIGNMENT FORM RANGE NOT FOUND')
          text=text[:i]+replacement+text[j+len(end):]
          Path(p).write_text(text)

          # Self-delete after patch to leave no workflow artifact.
          Path('.github/workflows/apply-supervisor-marketplace-ui.yml').unlink()
          PY
      - name: Commit patched existing files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ربط سوق عروض المشرفين بالواجهات الحالية"
          git push origin shared-construction-stages-20260808
