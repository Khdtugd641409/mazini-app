name: Fix admin supervisor section

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-admin-supervisor-section.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch admin supervisor section
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/AdminDashboardPage.jsx')
          s = p.read_text()
          start = s.index('            <section id="admin-supervisors" className="admin-dashboard-card">')
          end = s.index('\n            {adminStageWorkspace?.stage && (', start)
          replacement = '''            <section id="admin-supervisors" className="admin-dashboard-card">
              <header className="admin-dashboard-card-header">
                <div>
                  <h2>مشرفو المشاريع</h2>
                  <p>سجلات طلبات المشرفين والحسابات المعتمدة.</p>
                </div>
              </header>

              <div className="admin-supervisor-directory-grid">
                <button
                  type="button"
                  className="admin-supervisor-directory-card"
                  onClick={() => { window.location.href = "/admin/supervisor-applications?view=applicants"; }}
                >
                  <span className="admin-supervisor-directory-icon">📝</span>
                  <span className="admin-supervisor-directory-title">المشرفون المتقدمون</span>
                  <span className="admin-supervisor-directory-note">عرض طلبات التسجيل وسجلات المتقدمين</span>
                </button>

                <button
                  type="button"
                  className="admin-supervisor-directory-card"
                  onClick={() => { window.location.href = "/admin/supervisor-applications?view=approved"; }}
                >
                  <span className="admin-supervisor-directory-icon">✅</span>
                  <span className="admin-supervisor-directory-title">المشرفون المعتمدون</span>
                  <span className="admin-supervisor-directory-note">عرض سجلات المشرفين المقبولين في المنصة</span>
                </button>
              </div>
            </section>
'''
          p.write_text(s[:start] + replacement + s[end:])

          css = Path('src/pages/admin/AdminDashboardPage.css')
          c = css.read_text()
          addition = '''

.admin-supervisor-directory-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.admin-supervisor-directory-card {
  display: grid;
  gap: 10px;
  min-height: 150px;
  padding: 20px;
  color: #173f36;
  font: inherit;
  text-align: right;
  cursor: pointer;
  background: linear-gradient(135deg, #fbfaf7, #f3ecdc);
  border: 1px solid #dfd5bd;
  border-radius: 18px;
  box-shadow: 0 10px 24px rgba(86, 67, 28, 0.06);
}

.admin-supervisor-directory-card:hover,
.admin-supervisor-directory-card:focus-visible {
  transform: translateY(-2px);
  border-color: #b98a2b;
  box-shadow: 0 14px 28px rgba(86, 67, 28, 0.12);
  outline: none;
}

.admin-supervisor-directory-icon {
  font-size: 32px;
}

.admin-supervisor-directory-title {
  font-size: 21px;
  font-weight: 950;
}

.admin-supervisor-directory-note {
  color: #687872;
  line-height: 1.6;
}

@media (max-width: 720px) {
  .admin-supervisor-directory-grid {
    grid-template-columns: 1fr;
  }
}
'''
          if '.admin-supervisor-directory-grid' not in c:
              css.write_text(c + addition)
          PY
          git config user.name "ChatGPT Admin UI"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/admin/AdminDashboardPage.jsx src/pages/admin/AdminDashboardPage.css
          git commit -m "Replace legacy supervisor admin section with directory cards"
          git push origin HEAD:main
