name: Apply admin partners patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-admin-partners-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: node scripts/patch-admin-partners.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminDashboardPage.jsx src/pages/admin/AdminDashboardPage.css
          git commit -m "Replace legacy admin partner section" || exit 0
          git push origin HEAD:main
